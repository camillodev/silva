services:
  silva:
    image: ${SILVA_IMAGE:-silva:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      SILVA_GATEWAY_TOKEN: ${SILVA_GATEWAY_TOKEN}
      SILVA_ALLOW_INSECURE_PRIVATE_WS: ${SILVA_ALLOW_INSECURE_PRIVATE_WS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
    volumes:
      - ${SILVA_CONFIG_DIR}:/home/node/.silva
      - ${SILVA_WORKSPACE_DIR}:/home/node/.silva/workspace
    ports:
      - "${SILVA_GATEWAY_PORT:-18789}:18789"
      - "${SILVA_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${SILVA_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  silva-cli:
    image: ${SILVA_IMAGE:-silva:local}
    network_mode: "service:silva"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      SILVA_GATEWAY_TOKEN: ${SILVA_GATEWAY_TOKEN}
      SILVA_ALLOW_INSECURE_PRIVATE_WS: ${SILVA_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
    volumes:
      - ${SILVA_CONFIG_DIR}:/home/node/.silva
      - ${SILVA_WORKSPACE_DIR}:/home/node/.silva/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - silva

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Local Postgres — only needed when running without Supabase.
  # Set SUPABASE_URL in .env to use Supabase instead.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silva
      POSTGRES_PASSWORD: silva_dev
      POSTGRES_DB: silva
    volumes:
      - silva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silva"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - local-db

volumes:
  silva_postgres_data:
