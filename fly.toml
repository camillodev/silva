# OpenClaw Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "silva"
primary_region = "gru" # São Paulo — closest to BR users

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
SILVA_PREFER_PNPM = "1"
SILVA_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=1536"
# Secrets (set via `fly secrets set`):
#   SILVA_GATEWAY_TOKEN, ANTHROPIC_API_KEY, GEMINI_API_KEY,
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, SLACK_BOT_TOKEN, SLACK_APP_TOKEN

[processes]
app = "node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false # Keep running for persistent connections
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"

[mounts]
source = "silva_data"
destination = "/data"
